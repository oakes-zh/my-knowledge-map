<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 12px;
    }
    .url-display {
      font-size: 12px;
      color: #6b6b6b;
      padding: 8px 10px;
      background: #f8f7f4;
      border-radius: 6px;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .status.success { display: block; background: #E1F5EE; color: #085041; }
    .status.error { display: block; background: #FCEBEB; color: #A32D2D; }
    .status.loading { display: block; background: #EEEDFE; color: #3C3489; }
    .tags-container {
      margin-bottom: 12px;
      display: none;
    }
    .tags-container.show { display: block; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      background: #EEEDFE;
      color: #3C3489;
      border-radius: 12px;
      font-size: 12px;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .summary-text {
      font-size: 13px;
      color: #444;
      line-height: 1.6;
      padding: 8px 10px;
      background: #f8f7f4;
      border-radius: 6px;
      margin-bottom: 12px;
      display: none;
    }
    .summary-text.show { display: block; }
    button {
      width: 100%;
      padding: 10px;
      background: #534AB7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3C3489; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .settings-link {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #6b6b6b;
      cursor: pointer;
      text-decoration: underline;
    }
    .settings-panel {
      display: none;
      margin-bottom: 12px;
    }
    .settings-panel.show { display: block; }
    .settings-panel input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e5e4e0;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #CECBF6;
      border-top-color: #534AB7;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>Personal KB Clipper</h2>

  <div id="urlDisplay" class="url-display"></div>

  <div id="settingsPanel" class="settings-panel">
    <input type="text" id="backendUrl" placeholder="Backend URL (e.g. http://localhost:8900)">
    <button id="saveSettings" style="background: #6b6b6b; margin-bottom: 8px;">保存设置</button>
  </div>

  <div id="status" class="status"></div>
  <div id="summaryText" class="summary-text"></div>
  <div id="tagsContainer" class="tags-container"></div>

  <button id="clipBtn">剪藏到知识库</button>

  <div class="settings-link" id="settingsLink">设置 Backend URL</div>

  <script src="popup.js"></script>
</body>
</html>
